name: Build ZMK firmware
# push only on main: a PR branch already builds through pull_request, so a push to it would
# build it twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4de313367288aad5aeaa1243890e40dc813f7008 # main as of 2026-10-09
